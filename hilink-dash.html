<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hilink SMS Gateway</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root { --bg: #04070d; --accent: #00d4ff; --accent2: #7b61ff; --text: #e4e8ee; --muted: #7a8294; --card-bg: rgba(10,15,22,.9); }
* { box-sizing: border-box; }
body { font-family: 'Roboto', sans-serif; background: var(--bg); color: var(--text); font-size: .85rem; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
.text-grad { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.bg-bars { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bg-bar { position: absolute; border-radius: 999px; will-change: transform, opacity; opacity: 1; transition: opacity 3s ease; background: linear-gradient(180deg, transparent 0%, transparent 10%, rgba(0,212,255,.06) 25%, rgba(0,212,255,.25) 50%, rgba(0,212,255,.06) 75%, transparent 90%, transparent 100%); box-shadow: 0 0 12px rgba(0,212,255,.12); }
.bg-bar.dim { opacity: 0.1; }
.bg-bar.purple { background: linear-gradient(180deg, transparent 0%, transparent 10%, rgba(123,97,255,.05) 25%, rgba(123,97,255,.2) 50%, rgba(123,97,255,.05) 75%, transparent 90%, transparent 100%); box-shadow: 0 0 10px rgba(123,97,255,.1); }
.main-wrap { position: relative; z-index: 1; padding: 16px 0 80px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
.header-title { font-size: 1.4rem; font-weight: 900; letter-spacing: -.5px; }
.header-info { display: flex; align-items: center; gap: 10px; }
.btn-refresh { width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.04); color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .3s; }
.btn-refresh:hover { background: rgba(0,212,255,.1); color: var(--accent); border-color: rgba(0,212,255,.3); }
.nav-tabs-custom { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
.nav-tab-btn { padding: 8px 18px; font-size: .78rem; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; transition: all .3s; }
.nav-tab-btn:hover { color: var(--text); background: rgba(255,255,255,.04); }
.nav-tab-btn.active { background: rgba(0,212,255,.1); color: var(--accent); border-color: rgba(0,212,255,.25); box-shadow: 0 0 20px rgba(0,212,255,.08); }
.card-dash { background: var(--card-bg); border: 1px solid rgba(255,255,255,.06); border-radius: 14px; margin-bottom: 14px; overflow: hidden; backdrop-filter: blur(10px); transition: all .3s; }
.card-dash:hover { border-color: rgba(0,212,255,.15); }
.card-dash-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; border-bottom: 1px solid rgba(255,255,255,.04); font-weight: 700; font-size: .82rem; letter-spacing: .3px; }
.card-dash-header .refresh-icon { color: var(--muted); cursor: pointer; font-size: .8rem; transition: color .3s; }
.card-dash-header .refresh-icon:hover { color: var(--accent); }
.card-dash-body { padding: 14px 18px; }
.info-grid { display: grid; grid-template-columns: auto 1fr; gap: .25rem 1.2rem; align-items: baseline; }
.info-label { color: var(--muted); font-size: .8rem; white-space: nowrap; }
.info-value { font-weight: 500; color: var(--text); word-break: break-all; }
.signal-vis { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.signal-bars { display: flex; align-items: end; gap: 3px; height: 26px; }
.signal-bar { width: 5px; min-height: 3px; background: rgba(255,255,255,.12); border-radius: 1px; transition: background .3s; }
.signal-bar.active { background: var(--accent); }
.signal-badge { font-size: .7rem; font-weight: 700; padding: 3px 10px; border-radius: 6px; letter-spacing: .5px; text-transform: uppercase; }
.signal-badge.good { background: rgba(0,212,255,.12); color: var(--accent); }
.signal-badge.warn { background: rgba(255,183,0,.12); color: #ffb700; }
.signal-badge.bad { background: rgba(255,77,77,.12); color: #ff4d4d; }
.table-custom { width: 100%; border-collapse: collapse; font-size: .8rem; }
.table-custom th { text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,.06); color: var(--muted); font-weight: 700; font-size: .7rem; text-transform: uppercase; letter-spacing: .5px; }
.table-custom td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,.03); color: var(--text); }
.table-custom tr:hover td { background: rgba(255,255,255,.02); }
.xml-view { font-size: .72rem; max-height: 260px; overflow: auto; background: rgba(0,0,0,.3); padding: 10px 14px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; color: var(--muted); font-family: 'Courier New', monospace; }
.skeleton { display: inline-block; width: 70px; height: 12px; background: rgba(255,255,255,.06); border-radius: 4px; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: .7; } }
.toast-wrap { position: fixed; top: 16px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 6px; }
.toast-item { background: rgba(10,15,22,.95); border: 1px solid rgba(0,212,255,.2); color: var(--text); padding: 8px 16px; border-radius: 8px; font-size: .8rem; backdrop-filter: blur(12px); box-shadow: 0 8px 30px rgba(0,0,0,.5); }
@media (max-width: 768px) { .header-title { font-size: 1.1rem; } .nav-tab-btn { font-size: .7rem; padding: 6px 12px; } }
</style>
</head>
<body>

<div class="bg-bars" id="bgBars"></div>

<div class="main-wrap">
<div class="container-xl">

  <div class="header">
    <div class="header-title"><i class="bi bi-hdd-rack me-2 text-grad"></i>Hilink <span class="text-grad">SMS Gateway</span></div>
    <div class="header-info">
      <span id="lastUpdate" style="color:var(--muted);font-size:.78rem;"></span>
      <button class="btn-refresh" onclick="refreshAll()" title="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
    </div>
  </div>

  <div class="nav-tabs-custom" id="mainTabs">
    <button class="nav-tab-btn active" data-tab="device">Device</button>
    <button class="nav-tab-btn" data-tab="signal">Signal</button>
    <button class="nav-tab-btn" data-tab="network">Network</button>
    <button class="nav-tab-btn" data-tab="sms">SMS</button>
    <button class="nav-tab-btn" data-tab="config">Config</button>
    <button class="nav-tab-btn" data-tab="inbox">Inbox</button>
    <button class="nav-tab-btn" data-tab="settings">Settings</button>
  </div>

  <!-- Device -->
  <div class="tab-panel" id="panel-device">
    <div class="card-dash">
      <div class="card-dash-header"><span>Device Information</span><span class="refresh-icon bi bi-arrow-clockwise" onclick="loadDeviceInfo()"></span></div>
      <div class="card-dash-body" id="deviceInfoBody"><span class="skeleton"></span></div>
    </div>
    <div class="row g-3">
      <div class="col-md-6">
        <div class="card-dash">
          <div class="card-dash-header">Connection</div>
          <div class="card-dash-body" id="connectionBody"><span class="skeleton"></span></div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card-dash">
          <div class="card-dash-header">Uptime</div>
          <div class="card-dash-body" id="uptimeBody"><span class="skeleton"></span></div>
        </div>
      </div>
    </div>
    <div class="card-dash">
      <div class="card-dash-header">Traffic Statistics</div>
      <div class="card-dash-body" id="trafficBody"><span class="skeleton"></span></div>
    </div>
  </div>

  <!-- Signal -->
  <div class="tab-panel d-none" id="panel-signal">
    <div class="card-dash">
      <div class="card-dash-header"><span>Signal Status</span><span class="refresh-icon bi bi-arrow-clockwise" onclick="loadSignal()"></span></div>
      <div class="card-dash-body" id="signalBody"><span class="skeleton"></span></div>
    </div>
  </div>

  <!-- Network -->
  <div class="tab-panel d-none" id="panel-network">
    <div class="card-dash">
      <div class="card-dash-header"><span>Network</span><span class="refresh-icon bi bi-arrow-clockwise" onclick="loadNetwork()"></span></div>
      <div class="card-dash-body" id="networkBody"><span class="skeleton"></span></div>
    </div>
  </div>

  <!-- SMS -->
  <div class="tab-panel d-none" id="panel-sms">
    <div class="card-dash">
      <div class="card-dash-header"><span>SMS Counters</span><span class="refresh-icon bi bi-arrow-clockwise" onclick="loadSmsCount()"></span></div>
      <div class="card-dash-body" id="smsCountBody"><span class="skeleton"></span></div>
    </div>
    <div class="card-dash">
      <div class="card-dash-header"><span>Send Status</span><span class="refresh-icon bi bi-arrow-clockwise" onclick="loadSendStatus()"></span></div>
      <div class="card-dash-body" id="sendStatusBody"><span class="skeleton"></span></div>
    </div>
  </div>

  <!-- Config -->
  <div class="tab-panel d-none" id="panel-config">
    <div class="card-dash">
      <div class="card-dash-header"><span>SMS Configuration</span><span class="refresh-icon bi bi-arrow-clockwise" onclick="loadSmsConfig()"></span></div>
      <div class="card-dash-body" id="smsConfigBody"><span class="skeleton"></span></div>
    </div>
    <div class="card-dash">
      <div class="card-dash-header"><span>Raw Config XML</span><span class="refresh-icon bi bi-arrow-clockwise" onclick="loadSmsConfigXml()"></span></div>
      <div class="card-dash-body" id="smsConfigXmlBody"><span class="skeleton"></span></div>
    </div>
  </div>

  <!-- Inbox -->
  <div class="tab-panel d-none" id="panel-inbox">
    <div class="card-dash">
      <div class="card-dash-header"><span>SMS Inbox</span><span style="display:flex;gap:8px;align-items:center"><span class="refresh-icon bi bi-trash3" onclick="clearInbox()" title="Clear All" style="color:var(--muted);cursor:pointer;transition:color .3s" onmouseover="this.style.color='#ff4d4d'" onmouseout="this.style.color=''"></span><span class="refresh-icon bi bi-arrow-clockwise" onclick="loadInbox()"></span></span></div>
      <div class="card-dash-body" id="inboxBody"><span class="skeleton"></span></div>
    </div>
  </div>

  <!-- Settings -->
  <div class="tab-panel d-none" id="panel-settings">
    <div class="card-dash">
      <div class="card-dash-header">Change Password</div>
      <div class="card-dash-body" style="max-width:400px">
        <div style="margin-bottom:10px">
          <label style="color:var(--muted);font-size:.78rem;display:block;margin-bottom:4px">Current Password</label>
          <input type="password" id="oldPass" style="width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px 12px;color:var(--text);font-size:.85rem">
        </div>
        <div style="margin-bottom:10px">
          <label style="color:var(--muted);font-size:.78rem;display:block;margin-bottom:4px">New Password</label>
          <input type="password" id="newPass" style="width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px 12px;color:var(--text);font-size:.85rem">
        </div>
        <div style="margin-bottom:10px">
          <label style="color:var(--muted);font-size:.78rem;display:block;margin-bottom:4px">Confirm New Password</label>
          <input type="password" id="confirmPass" style="width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px 12px;color:var(--text);font-size:.85rem">
        </div>
        <button onclick="changePassword()" style="background:linear-gradient(135deg,#00d4ff,#7b61ff);border:none;color:#04070d;padding:8px 24px;border-radius:8px;font-weight:700;font-size:.82rem;cursor:pointer;transition:all .3s">Change Password</button>
        <div id="passResult" style="margin-top:8px;font-size:.8rem"></div>
      </div>
    </div>
  </div>

</div>
</div>

<div style="text-align:center;position:fixed;bottom:14px;left:0;right:0;z-index:10;pointer-events:none">
  <svg viewBox="0 0 155 205" style="width:32px;height:auto;opacity:.4;display:inline-block">
    <rect x="7" y="7" width="141" height="191" rx="15" ry="15" fill="none" stroke="url(#ptg)" stroke-width="4"/>
    <text x="50%" y="50%" text-anchor="middle" fill="url(#ptg)" font-size="140" font-weight="900" dy=".3em">P</text>
    <text x="65%" y="70%" text-anchor="middle" fill="#7b61ff" font-size="75" font-weight="bold" dy=".3em">t</text>
    <defs><linearGradient id="ptg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#7b61ff"/></linearGradient></defs>
  </svg>
  <div style="margin-top:2px;font-size:.82rem;font-weight:900;letter-spacing:-.3px;color:#fff;font-family:'Roboto',sans-serif">
    Plurum<span style="background:linear-gradient(135deg,#00d4ff,#7b61ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">Tech</span>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = '/cgi-bin/sms-gw.pl';

// --- Background bars ---
(function(){
  var c = document.getElementById('bgBars'); if(!c)return;
  var NUM=30, winH, winW;
  function recalc(){ winH=window.innerHeight; winW=window.innerWidth; }
  recalc();
  var bars=[];
  for(var i=0;i<NUM;i++){
    var el=document.createElement('div'); el.className='bg-bar';
    if(i%4===0)el.classList.add('purple');
    var w=10+Math.random()*60;
    el.style.width=w+'px'; el.style.height=(winH*6)+'px';
    el.style.top='-'+(winH*2.5)+'px';
    el.style.left=((i/NUM)*100+(Math.random()-0.5)*5)+'%';
    if(Math.random()>.55)el.classList.add('dim');
    c.appendChild(el);
    bars.push({el:el,spdY:.15+Math.random()*1.8,spdX:.3+Math.random()*.8,baseY:(Math.random()-.5)*winH*1.5,basePct:(i/NUM)*100,nextFade:6+Math.random()*15,dimmed:Math.random()>.55});
  }
  var start=Date.now();
  function drift(){
    var now=Date.now(),elapsed=(now-start)/1000,scrollY=window.pageYOffset;
    bars.forEach(function(d){
      var y=d.baseY-scrollY*d.spdY*.5;
      while(y<-winH*2.5)y+=winH*6; while(y>winH*3.5)y-=winH*6;
      var driftPx=(elapsed*d.spdX*winW)/180;
      driftPx=driftPx%(winW+100); var barL=(d.basePct/100)*winW;
      var mappedX=((barL-driftPx)%(winW+100));
      if(mappedX<-60)mappedX+=winW+100;
      d.el.style.transform='translateY('+y+'px) translateX('+(mappedX-barL)+'px)';
      d.nextFade-=.016;
      if(!d.dimmed&&d.nextFade<=0){d.dimmed=true;d.dimStart=now;d.el.classList.add('dim');}
      if(d.dimmed&&(now-d.dimStart)>2500){d.dimmed=false;d.el.classList.remove('dim');d.nextFade=6+Math.random()*15;}
    });
    requestAnimationFrame(drift);
  }
  window.addEventListener('resize',recalc);
  drift();
})();

// --- Tab switching ---
document.querySelectorAll('.nav-tab-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.nav-tab-btn').forEach(function(b){b.classList.remove('active');});
    this.classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.add('d-none');});
    var panel=document.getElementById('panel-'+this.dataset.tab);
    if(panel){panel.classList.remove('d-none'); loadTab(this.dataset.tab);}
  });
});

function loadTab(name){
  switch(name){
    case 'device': loadDeviceInfo(); break;
    case 'signal': loadSignal(); break;
    case 'network': loadNetwork(); break;
    case 'sms': loadSmsCount(); loadSendStatus(); break;
    case 'config': loadSmsConfig(); loadSmsConfigXml(); break;
    case 'inbox': loadInbox(); break;
    case 'settings': break;
  }
}

function changePassword(){
  var oldP=document.getElementById('oldPass').value;
  var newP=document.getElementById('newPass').value;
  var confP=document.getElementById('confirmPass').value;
  var res=document.getElementById('passResult');
  if(!oldP||!newP||!confP){res.innerHTML='<span style="color:#ff4d4d">Fill all fields</span>';return;}
  if(newP!==confP){res.innerHTML='<span style="color:#ff4d4d">Passwords do not match</span>';return;}
  if(newP.length<4){res.innerHTML='<span style="color:#ff4d4d">Too short (min 4)</span>';return;}
  res.innerHTML='<span class="skeleton"></span>';
  fetch(API+'?action=change-password&old='+encodeURIComponent(oldP)+'&new='+encodeURIComponent(newP)).then(function(r){return r.text();}).then(function(t){
    if(t==='OK'){res.innerHTML='<span style="color:#00d4ff">Password changed</span>';document.getElementById('oldPass').value='';document.getElementById('newPass').value='';document.getElementById('confirmPass').value='';}
    else{res.innerHTML='<span style="color:#ff4d4d">'+esc(t)+'</span>';}
  }).catch(function(e){res.innerHTML='<span style="color:#ff4d4d">Request failed</span>';});
}

function toast(msg){
  var el=document.createElement('div'); el.className='toast-item'; el.textContent=msg;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(function(){el.remove()},2500);
}

function xmlVal(xml,tag){ var m=xml.match(new RegExp('<'+tag+'>(.*?)<\\/'+tag+'>')); return m?m[1].trim():''; }

function fmtBytes(b){ if(!b)return'0 B'; var u=['B','KB','MB','GB'],i=0; b=parseInt(b)||0; while(b>=1024&&i<u.length-1){b/=1024;i++} return b.toFixed(1)+' '+u[i]; }
function fmtSecs(s){ s=parseInt(s)||0; var d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60); return(d?d+'d ':'')+h+'h '+m+'m'; }
function fmtDate(d){ if(!d)return''; var p=d.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2}):(\d{2})$/); if(!p)return d; var dt=new Date(p[1],p[2]-1,p[3],p[4],p[5],p[6]); return dt.toLocaleString('ru-RU'); }

function signalInfo(rsrp){
  if(!rsrp)return{bars:0,text:'N/A',cls:'warn'};
  var v=parseFloat(rsrp);
  if(v>=-80)return{bars:5,text:'Excellent',cls:'good'};
  if(v>=-90)return{bars:4,text:'Good',cls:'good'};
  if(v>=-100)return{bars:3,text:'Fair',cls:'warn'};
  if(v>=-110)return{bars:2,text:'Poor',cls:'bad'};
  return{bars:1,text:'Very Poor',cls:'bad'};
}

function renderBars(n){ var h='<div class="signal-bars">'; for(var i=1;i<=5;i++)h+='<div class="signal-bar'+(i<=n?' active':'')+'" style="height:'+(3+i*4)+'px"></div>'; return h+'</div>'; }

function renderGrid(data){ var h='<div class="info-grid">'; for(var k in data)h+='<span class="info-label">'+k+'</span><span class="info-value">'+(data[k]||'-')+'</span>'; return h+'</div>'; }

function fetchApi(action,extra){ var url=API+'?action='+encodeURIComponent(action); if(extra)url+='&'+extra; return fetch(url).then(function(r){return r.text();}); }

function updateTime(){ document.getElementById('lastUpdate').textContent=new Date().toLocaleString('ru-RU'); }

// --- Device ---
function loadDeviceInfo(){
  var b=document.getElementById('deviceInfoBody'); b.innerHTML='<span class="skeleton"></span>';
  fetchApi('info').then(function(x){
    if(x.includes('<code>')){b.innerHTML='<span style="color:#ff4d4d">Error: '+xmlVal(x,'code')+'</span>';return;}
    b.innerHTML=renderGrid({
      'Device':xmlVal(x,'DeviceName'),'IMEI':xmlVal(x,'Imei'),'IMSI':xmlVal(x,'Imsi'),
      'ICCID':xmlVal(x,'Iccid'),'Hardware':xmlVal(x,'HardwareVersion'),
      'Software':xmlVal(x,'SoftwareVersion').replace(/&#40;/g,'(').replace(/&#41;/g,')'),
      'WebUI':xmlVal(x,'WebUIVersion').replace(/&#40;/g,'(').replace(/&#41;/g,')'),
      'MAC':xmlVal(x,'MacAddress1'),'Serial':xmlVal(x,'SerialNumber'),
      'Work Mode':xmlVal(x,'workmode'),'Support':xmlVal(x,'supportmode')
    });
    updateTime();
    var u=xmlVal(x,'uptime');
    document.getElementById('uptimeBody').innerHTML='<div style="font-size:1.4rem;font-weight:700;color:var(--accent)">'+fmtSecs(u||0)+'</div>';
  }).catch(function(e){b.innerHTML='<span style="color:#ff4d4d">Request failed: '+e.message+'</span>';});

  fetchApi('get','name=netCurrentPlmn').then(function(x){
    document.getElementById('connectionBody').innerHTML=renderGrid({
      'Operator':xmlVal(x,'FullName'),'Numeric':xmlVal(x,'Numeric'),
      'RAT':xmlVal(x,'Rat')==='7'?'LTE':xmlVal(x,'Rat')
    });
  }).catch(function(){});

  fetchApi('get','name=trafficStatistics').then(function(x){
    document.getElementById('trafficBody').innerHTML=renderGrid({
      'Current Upload':fmtBytes(xmlVal(x,'CurrentUpload')),'Current Download':fmtBytes(xmlVal(x,'CurrentDownload')),
      'Current Duration':fmtSecs(xmlVal(x,'CurrentConnectTime')),'Total Upload':fmtBytes(xmlVal(x,'TotalUpload')),
      'Total Download':fmtBytes(xmlVal(x,'TotalDownload'))
    });
  }).catch(function(){});
}

// --- Signal ---
function loadSignal(){
  var b=document.getElementById('signalBody'); b.innerHTML='<span class="skeleton"></span>';
  fetchApi('signal').then(function(x){
    if(x.includes('<code>')){b.innerHTML='<span style="color:#ff4d4d">Error: '+xmlVal(x,'code')+'</span>';return;}
    var rsrp=xmlVal(x,'rsrp'),si=signalInfo(rsrp);
    b.innerHTML='<div class="row g-3"><div class="col-md-6">'+
      '<div class="signal-vis">'+renderBars(si.bars)+'<span class="signal-badge '+si.cls+'">'+si.text+'</span></div>'+
      renderGrid({'RSRP':rsrp||'-','RSRQ':xmlVal(x,'rsrq')||'-','RSSI':xmlVal(x,'rssi')||'-','SINR':xmlVal(x,'sinr')||'-'})+
      '</div><div class="col-md-6">'+
      renderGrid({'Band':xmlVal(x,'band')||'-','Cell ID':xmlVal(x,'cell_id')||'-','PCI':xmlVal(x,'pci')||'-',
        'eNodeB':xmlVal(x,'enodeb_id')||'-','Bandwidth DL':xmlVal(x,'dlbandwidth')||'-','EARFCN':xmlVal(x,'earfcn')||'-',
        'Tx Power':xmlVal(x,'txpower')?xmlVal(x,'txpower').substring(0,28):'-'
      })+'</div></div>';
    updateTime();
  }).catch(function(e){b.innerHTML='<span style="color:#ff4d4d">Request failed: '+e.message+'</span>';});
}

// --- Network ---
function loadNetwork(){
  var b=document.getElementById('networkBody'); b.innerHTML='<span class="skeleton"></span>';
  fetchApi('get','name=netCurrentPlmn').then(function(x){
    b.innerHTML=renderGrid({'Operator':xmlVal(x,'FullName'),'Short Name':xmlVal(x,'ShortName'),
      'Numeric':xmlVal(x,'Numeric'),'RAT':xmlVal(x,'Rat')==='7'?'LTE':xmlVal(x,'Rat'),'State':xmlVal(x,'State')});
    updateTime();
  }).catch(function(e){b.innerHTML='<span style="color:#ff4d4d">Request failed: '+e.message+'</span>';});
}

// --- SMS Count ---
function clearBox(type, label){
  if(!confirm('Delete all messages from '+label+'?'))return;
  fetch(API+'?action=clear-box&type='+type).then(function(r){return r.text();}).then(function(t){loadSmsCount();toast(t);}).catch(function(e){toast('Error');});
}

function loadSmsCount(){
  var b=document.getElementById('smsCountBody'); b.innerHTML='<span class="skeleton"></span>';
  fetchApi('sms-count').then(function(x){
    var items={
      'Local Inbox':{val:xmlVal(x,'LocalInbox'),type:'inbox'},
      'Local Outbox':{val:xmlVal(x,'LocalOutbox'),type:'outbox'},
      'Local Draft':{val:xmlVal(x,'LocalDraft'),type:'draft'},
      'Unread':{val:xmlVal(x,'LocalUnread')},'New':{val:xmlVal(x,'NewMsg')},'Max':{val:xmlVal(x,'LocalMax')}
    };
    var h='<div class="info-grid">';
    for(var k in items){
      h+='<span class="info-label">'+k+'</span><span class="info-value" style="display:flex;align-items:center;gap:8px">'+(items[k].val||'0');
      if(items[k].type&&parseInt(items[k].val)>0)h+='<span class="refresh-icon bi bi-trash3" style="font-size:.75rem;color:rgba(255,255,255,.15);cursor:pointer;transition:color .3s" onclick="clearBox(\''+items[k].type+'\',\''+k+'\')" onmouseover="this.style.color=\'#ff4d4d\'" onmouseout="this.style.color=\'\'"></span>';
      h+='</span>';
    }
    h+='</div>'; b.innerHTML=h; updateTime();
  }).catch(function(e){b.innerHTML='<span style="color:#ff4d4d">Request failed: '+e.message+'</span>';});
}

// --- Send Status ---
function loadSendStatus(){
  var b=document.getElementById('sendStatusBody'); b.innerHTML='<span class="skeleton"></span>';
  fetchApi('send-status').then(function(x){
    b.innerHTML=renderGrid({'Successful Phone':xmlVal(x,'SucPhone')||'-','Failed Phone':xmlVal(x,'FailPhone')||'-',
      'Total Count':xmlVal(x,'TotalCount'),'Current Index':xmlVal(x,'CurIndex')});
    updateTime();
  }).catch(function(e){b.innerHTML='<span style="color:#ff4d4d">Request failed: '+e.message+'</span>';});
}

// --- SMS Config ---
function loadSmsConfig(){
  var b=document.getElementById('smsConfigBody'); b.innerHTML='<span class="skeleton"></span>';
  fetchApi('sms-config').then(function(x){
    b.innerHTML=renderGrid({'SMS Center':xmlVal(x,'Sca'),'Validity':xmlVal(x,'Validity')+' min',
      'Save Mode':xmlVal(x,'SaveMode'),'Send Type':xmlVal(x,'SendType'),
      'Delivery Report':xmlVal(x,'UseSReport')==='1'?'On':'Off','Page Size':xmlVal(x,'pagesize'),
      'Forward':xmlVal(x,'sms_forward_enable')==='1'?'On':'Off'});
    updateTime();
  }).catch(function(e){b.innerHTML='<span style="color:#ff4d4d">Request failed: '+e.message+'</span>';});
}

// --- SMS Config XML ---
function loadSmsConfigXml(){
  var b=document.getElementById('smsConfigXmlBody'); b.innerHTML='<span class="skeleton"></span>';
  fetchApi('sms-config-xml').then(function(x){b.innerHTML='<div class="xml-view">'+esc(x)+'</div>';updateTime();})
  .catch(function(e){b.innerHTML='<span style="color:#ff4d4d">Request failed: '+e.message+'</span>';});
}

// --- Inbox ---
function clearInbox(){
  if(!confirm('Delete all messages from inbox?'))return;
  fetch(API+'?action=clear-box&type=inbox').then(function(r){return r.text();}).then(function(t){
    loadInbox();
    toast(t);
  }).catch(function(e){toast('Error: '+e.message);});
}

function loadInbox(){
  var b=document.getElementById('inboxBody'); b.innerHTML='<span class="skeleton"></span>';
  fetchApi('list').then(function(x){
    var msgs=x.match(/<Message>[\s\S]*?<\/Message>/g);
    if(!msgs||!msgs.length){b.innerHTML='<p style="color:var(--muted)">No messages</p>';return;}
    var h='<table class="table-custom"><thead><tr><th>#</th><th>From</th><th>Message</th><th>Date</th></tr></thead><tbody>';
    for(var i=0;i<msgs.length;i++){
      var m=msgs[i];
      h+='<tr><td>'+xmlVal(m,'Index')+'</td><td>'+esc(xmlVal(m,'Phone'))+'</td><td>'+esc(xmlVal(m,'Content'))+'</td><td style="white-space:nowrap;font-size:.75rem">'+fmtDate(xmlVal(m,'Date'))+'</td></tr>';
    }
    h+='</tbody></table>'; b.innerHTML=h; updateTime();
  }).catch(function(e){b.innerHTML='<span style="color:#ff4d4d">Request failed: '+e.message+'</span>';});
}

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function refreshAll(){
  var active=document.querySelector('.nav-tab-btn.active');
  if(active)loadTab(active.dataset.tab);
  toast('Refreshed');
}

document.querySelectorAll('.nav-tab-btn').forEach(function(t){t.addEventListener('shown',function(){});});
setInterval(refreshAll,30000);
loadDeviceInfo();
</script>
