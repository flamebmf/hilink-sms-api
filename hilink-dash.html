<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hilink SMS Gateway</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
body { background: #f5f5f5; font-size: .88rem; }
.card { margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.card-header { font-weight: 600; padding: .5rem 1rem; }
.card-body { padding: .75rem 1rem; }
.info-grid { display: grid; grid-template-columns: auto 1fr; gap: .2rem 1rem; }
.info-label { color: #888; white-space: nowrap; }
.refresh-btn { cursor: pointer; }
.signal-bars { display: flex; align-items: end; gap: 3px; height: 28px; margin: 0 8px; }
.signal-bar { width: 6px; min-height: 4px; background: #aaa; border-radius: 1px; }
.signal-bar.active { background: #198754; }
#toast-container { position: fixed; top: 1rem; right: 1rem; z-index: 9999; }
.toast-msg { background: #333; color: #fff; padding: .5rem 1rem; border-radius: 6px; margin-bottom: .5rem; font-size: .85rem; }
.xml-view { font-size: .75rem; max-height: 300px; overflow: auto; background: #f8f9fa; padding: .5rem; border-radius: 4px; white-space: pre-wrap; word-break: break-all; }
.nav-pills .nav-link { padding: .3rem 1rem; font-size: .85rem; }
.tab-content { min-height: 400px; }
.badge-signal { font-size: .75rem; }
.skeleton { display: inline-block; width: 80px; height: 14px; background: #e0e0e0; border-radius: 4px; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
</style>
</head>
<body>

<div class="container py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0"><i class="bi bi-hdd-rack"></i> Hilink SMS Gateway</h5>
    <div>
      <span id="lastUpdate" class="text-muted small me-2"></span>
      <button class="btn btn-sm btn-outline-secondary" onclick="refreshAll()" title="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
    </div>
  </div>

  <ul class="nav nav-pills mb-3" id="mainTabs" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-device">Device</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-signal">Signal</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-network">Network</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-sms">SMS</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-config">Config</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-inbox">Inbox</button></li>
  </ul>

  <div class="tab-content">
    <!-- Device Info -->
    <div class="tab-pane fade show active" id="tab-device">
      <div class="card">
        <div class="card-header d-flex justify-content-between"><span>Device Information</span><a class="refresh-btn small" onclick="loadDeviceInfo()"><i class="bi bi-arrow-clockwise"></i></a></div>
        <div class="card-body" id="deviceInfoBody"><div class="skeleton"></div></div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="card">
            <div class="card-header">Connection</div>
            <div class="card-body" id="connectionBody"><div class="skeleton"></div></div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card">
            <div class="card-header">Uptime</div>
            <div class="card-body" id="uptimeBody"><div class="skeleton"></div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Signal -->
    <div class="tab-pane fade" id="tab-signal">
      <div class="card">
        <div class="card-header d-flex justify-content-between"><span>Signal Status</span><a class="refresh-btn small" onclick="loadSignal()"><i class="bi bi-arrow-clockwise"></i></a></div>
        <div class="card-body" id="signalBody"><div class="skeleton"></div></div>
      </div>
    </div>

    <!-- Network -->
    <div class="tab-pane fade" id="tab-network">
      <div class="card">
        <div class="card-header d-flex justify-content-between"><span>Network</span><a class="refresh-btn small" onclick="loadNetwork()"><i class="bi bi-arrow-clockwise"></i></a></div>
        <div class="card-body" id="networkBody"><div class="skeleton"></div></div>
      </div>
      <div class="card">
        <div class="card-header">Traffic Statistics</div>
        <div class="card-body" id="trafficBody"><div class="skeleton"></div></div>
      </div>
    </div>

    <!-- SMS -->
    <div class="tab-pane fade" id="tab-sms">
      <div class="card">
        <div class="card-header d-flex justify-content-between"><span>SMS Counters</span><a class="refresh-btn small" onclick="loadSmsCount()"><i class="bi bi-arrow-clockwise"></i></a></div>
        <div class="card-body" id="smsCountBody"><div class="skeleton"></div></div>
      </div>
      <div class="card">
        <div class="card-header d-flex justify-content-between"><span>Send Status</span><a class="refresh-btn small" onclick="loadSendStatus()"><i class="bi bi-arrow-clockwise"></i></a></div>
        <div class="card-body" id="sendStatusBody"><div class="skeleton"></div></div>
      </div>
    </div>

    <!-- Config -->
    <div class="tab-pane fade" id="tab-config">
      <div class="card">
        <div class="card-header d-flex justify-content-between"><span>SMS Configuration</span><a class="refresh-btn small" onclick="loadSmsConfig()"><i class="bi bi-arrow-clockwise"></i></a></div>
        <div class="card-body" id="smsConfigBody"><div class="skeleton"></div></div>
      </div>
      <div class="card">
        <div class="card-header d-flex justify-content-between"><span>Raw Config XML</span><a class="refresh-btn small" onclick="loadSmsConfigXml()"><i class="bi bi-arrow-clockwise"></i></a></div>
        <div class="card-body" id="smsConfigXmlBody"><div class="skeleton"></div></div>
      </div>
    </div>

    <!-- Inbox -->
    <div class="tab-pane fade" id="tab-inbox">
      <div class="card">
        <div class="card-header d-flex justify-content-between"><span>SMS Inbox</span><a class="refresh-btn small" onclick="loadInbox()"><i class="bi bi-arrow-clockwise"></i></a></div>
        <div class="card-body" id="inboxBody"><div class="skeleton"></div></div>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = '/cgi-bin/sms-gw.pl';

function toast(msg, type) {
  var el = document.createElement('div');
  el.className = 'toast-msg';
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(function(){ el.remove(); }, 3000);
}

function xmlVal(xml, tag) {
  var m = xml.match(new RegExp('<' + tag + '>(.*?)<\\/' + tag + '>'));
  return m ? m[1].trim() : '';
}

function xmlVals(xml, tag) {
  var re = new RegExp('<' + tag + '>(.*?)<\\/' + tag + '>', 'g');
  var r = [], m;
  while ((m = re.exec(xml)) !== null) r.push(m[1].trim());
  return r;
}

function fmtBytes(b) {
  if (!b) return '0 B';
  var u = ['B','KB','MB','GB'], i = 0;
  b = parseInt(b) || 0;
  while (b >= 1024 && i < u.length-1) { b /= 1024; i++; }
  return b.toFixed(1) + ' ' + u[i];
}

function fmtSecs(s) {
  s = parseInt(s) || 0;
  var d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60);
  return (d ? d + 'd ' : '') + h + 'h ' + m + 'm';
}

function fmtDate(d) {
  if (!d) return '';
  var parts = d.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2}):(\d{2})$/);
  if (!parts) return d;
  var date = new Date(parts[1], parts[2]-1, parts[3], parts[4], parts[5], parts[6]);
  return date.toLocaleString('ru-RU');
}

function signalQuality(rsrp) {
  if (!rsrp) return {text: 'N/A', cls: 'secondary'};
  var v = parseFloat(rsrp);
  if (v >= -85) return {text: 'Excellent', cls: 'success'};
  if (v >= -95) return {text: 'Good', cls: 'success'};
  if (v >= -105) return {text: 'Fair', cls: 'warning'};
  return {text: 'Poor', cls: 'danger'};
}

function signalBars(rsrp) {
  if (!rsrp) return 0;
  var v = parseFloat(rsrp);
  if (v >= -80) return 5;
  if (v >= -90) return 4;
  if (v >= -100) return 3;
  if (v >= -110) return 2;
  return 1;
}

function renderSignalBars(count, max) {
  var html = '<div class="signal-bars">';
  for (var i = 1; i <= (max || 5); i++) {
    html += '<div class="signal-bar' + (i <= count ? ' active' : '') + '" style="height:' + (4 + i * 4) + 'px"></div>';
  }
  return html + '</div>';
}

function renderInfoGrid(data) {
  var html = '<div class="info-grid">';
  for (var k in data) {
    html += '<span class="info-label">' + k + '</span><span class="fw-medium">' + (data[k] || '-') + '</span>';
  }
  return html + '</div>';
}

function fetchApi(action, extra) {
  var url = API + '?action=' + encodeURIComponent(action);
  if (extra) url += '&' + extra;
  return fetch(url).then(function(r) { return r.text(); });
}

function updateTime() {
  document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('ru-RU');
}

// Device Info
function loadDeviceInfo() {
  var body = document.getElementById('deviceInfoBody');
  body.innerHTML = '<div class="skeleton"></div>';
  fetchApi('info').then(function(xml) {
    if (xml.includes('<code>')) { body.innerHTML = '<span class="text-danger">Error: ' + xmlVal(xml, 'code') + '</span>'; return; }
    body.innerHTML = renderInfoGrid({
      'Device': xmlVal(xml, 'DeviceName'),
      'IMEI': xmlVal(xml, 'Imei'),
      'IMSI': xmlVal(xml, 'Imsi'),
      'ICCID': xmlVal(xml, 'Iccid'),
      'Hardware': xmlVal(xml, 'HardwareVersion'),
      'Software': xmlVal(xml, 'SoftwareVersion').replace(/&#40;/g,'(').replace(/&#41;/g,')'),
      'WebUI': xmlVal(xml, 'WebUIVersion').replace(/&#40;/g,'(').replace(/&#41;/g,')'),
      'MAC': xmlVal(xml, 'MacAddress1'),
      'Serial': xmlVal(xml, 'SerialNumber'),
      'Work Mode': xmlVal(xml, 'workmode'),
      'Support': xmlVal(xml, 'supportmode'),
    });
    updateTime();
  }).catch(function(e) { body.innerHTML = '<span class="text-danger">Request failed: ' + e.message + '</span>'; });

  fetchApi('get', 'name=trafficStatistics').then(function(xml) {
    var tb = document.getElementById('trafficBody');
    if (tb) {
      tb.innerHTML = renderInfoGrid({
        'Current Connect': fmtBytes(xmlVal(xml, 'CurrentConnectTime')),
        'Current Upload': fmtBytes(xmlVal(xml, 'CurrentUpload')),
        'Current Download': fmtBytes(xmlVal(xml, 'CurrentDownload')),
        'Current Duration': fmtSecs(xmlVal(xml, 'CurrentConnectTime')),
        'Total Upload': fmtBytes(xmlVal(xml, 'TotalUpload')),
        'Total Download': fmtBytes(xmlVal(xml, 'TotalDownload')),
      });
    }
  }).catch(function(){});

  fetchApi('get', 'name=netCurrentPlmn').then(function(xml) {
    var nb = document.getElementById('connectionBody');
    if (nb) {
      nb.innerHTML = renderInfoGrid({
        'Operator': xmlVal(xml, 'FullName'),
        'Numeric': xmlVal(xml, 'Numeric'),
        'RAT': xmlVal(xml, 'Rat') === '7' ? 'LTE' : xmlVal(xml, 'Rat'),
      });
    }
  }).catch(function(){});

  var uptime = xmlVal(xml, 'uptime');
  var el = document.getElementById('uptimeBody');
  if (el) el.innerHTML = '<div class="fs-4 fw-bold">' + fmtSecs(uptime || 0) + '</div>';
}

// Signal
function loadSignal() {
  var body = document.getElementById('signalBody');
  body.innerHTML = '<div class="skeleton"></div>';
  fetchApi('signal').then(function(xml) {
    if (xml.includes('<code>')) { body.innerHTML = '<span class="text-danger">Error: ' + xmlVal(xml, 'code') + '</span>'; return; }
    var rsrp = xmlVal(xml, 'rsrp');
    var bars = signalBars(rsrp);
    var qual = signalQuality(rsrp);
    body.innerHTML = '<div class="row">' +
      '<div class="col-md-6">' +
        renderInfoGrid({
          'RSRP': rsrp || '-',
          'RSRQ': xmlVal(xml, 'rsrq') || '-',
          'RSSI': xmlVal(xml, 'rssi') || '-',
          'SINR': xmlVal(xml, 'sinr') || '-',
        }) +
      '</div>' +
      '<div class="col-md-6">' +
        '<div class="d-flex align-items-center mb-2">' +
          renderSignalBars(bars) +
          '<span class="ms-2 badge bg-' + qual.cls + ' badge-signal">' + qual.text + '</span>' +
        '</div>' +
        renderInfoGrid({
          'Band': xmlVal(xml, 'band') || '-',
          'EARFCN DL': xmlVal(xml, 'earfcn') ? xmlVal(xml, 'earfcn').replace('DL:','').split(' ')[0] : '-',
          'EARFCN UL': xmlVal(xml, 'earfcn') ? xmlVal(xml, 'earfcn').split(' ')[1].replace('UL:','') : '-',
          'Cell ID': xmlVal(xml, 'cell_id') || '-',
          'PCI': xmlVal(xml, 'pci') || '-',
          'eNodeB': xmlVal(xml, 'enodeb_id') || '-',
          'Bandwidth': xmlVal(xml, 'dlbandwidth') || '-',
          'Tx Power': xmlVal(xml, 'txpower') ? xmlVal(xml, 'txpower').substring(0, 30) : '-',
        }) +
      '</div>' +
    '</div>';
    updateTime();
  }).catch(function(e) { body.innerHTML = '<span class="text-danger">Request failed: ' + e.message + '</span>'; });
}

// Network
function loadNetwork() {
  var body = document.getElementById('networkBody');
  body.innerHTML = '<div class="skeleton"></div>';
  fetchApi('get', 'name=netCurrentPlmn').then(function(xml) {
    body.innerHTML = renderInfoGrid({
      'Operator': xmlVal(xml, 'FullName'),
      'Short Name': xmlVal(xml, 'ShortName'),
      'Numeric': xmlVal(xml, 'Numeric'),
      'RAT': xmlVal(xml, 'Rat') === '7' ? 'LTE' : xmlVal(xml, 'Rat'),
      'State': xmlVal(xml, 'State'),
    });
    updateTime();
  }).catch(function(e) { body.innerHTML = '<span class="text-danger">Request failed: ' + e.message + '</span>'; });
}

// SMS Count
function loadSmsCount() {
  var body = document.getElementById('smsCountBody');
  body.innerHTML = '<div class="skeleton"></div>';
  fetchApi('sms-count').then(function(xml) {
    body.innerHTML = renderInfoGrid({
      'Local Inbox': xmlVal(xml, 'LocalInbox'),
      'Local Unread': xmlVal(xml, 'LocalUnread'),
      'Local Outbox': xmlVal(xml, 'LocalOutbox'),
      'Local Draft': xmlVal(xml, 'LocalDraft'),
      'Local Max': xmlVal(xml, 'LocalMax'),
      'Unread': xmlVal(xml, 'NewMsg'),
    });
    updateTime();
  }).catch(function(e) { body.innerHTML = '<span class="text-danger">Request failed: ' + e.message + '</span>'; });
}

// Send Status
function loadSendStatus() {
  var body = document.getElementById('sendStatusBody');
  body.innerHTML = '<div class="skeleton"></div>';
  fetchApi('send-status').then(function(xml) {
    body.innerHTML = renderInfoGrid({
      'Successful Phone': xmlVal(xml, 'SucPhone') || '-',
      'Failed Phone': xmlVal(xml, 'FailPhone') || '-',
      'Phone': xmlVal(xml, 'Phone') || '-',
      'Total Count': xmlVal(xml, 'TotalCount'),
      'Current Index': xmlVal(xml, 'CurIndex'),
    });
    updateTime();
  }).catch(function(e) { body.innerHTML = '<span class="text-danger">Request failed: ' + e.message + '</span>'; });
}

// SMS Config
function loadSmsConfig() {
  var body = document.getElementById('smsConfigBody');
  body.innerHTML = '<div class="skeleton"></div>';
  fetchApi('sms-config').then(function(xml) {
    body.innerHTML = renderInfoGrid({
      'SMS Center': xmlVal(xml, 'Sca'),
      'Validity': xmlVal(xml, 'Validity') + ' min',
      'Save Mode': xmlVal(xml, 'SaveMode'),
      'Send Type': xmlVal(xml, 'SendType'),
      'Delivery Report': xmlVal(xml, 'UseSReport') === '1' ? 'On' : 'Off',
      'Page Size': xmlVal(xml, 'pagesize'),
      'Forward': xmlVal(xml, 'sms_forward_enable') === '1' ? 'On' : 'Off',
    });
    updateTime();
  }).catch(function(e) { body.innerHTML = '<span class="text-danger">Request failed: ' + e.message + '</span>'; });
}

// SMS Config XML
function loadSmsConfigXml() {
  var body = document.getElementById('smsConfigXmlBody');
  body.innerHTML = '<div class="skeleton"></div>';
  fetchApi('sms-config-xml').then(function(xml) {
    body.innerHTML = '<div class="xml-view">' + escHtml(xml) + '</div>';
    updateTime();
  }).catch(function(e) { body.innerHTML = '<span class="text-danger">Request failed: ' + e.message + '</span>'; });
}

// Inbox
function loadInbox() {
  var body = document.getElementById('inboxBody');
  body.innerHTML = '<div class="skeleton"></div>';
  fetchApi('list').then(function(xml) {
    var messages = xml.match(/<Message>([\s\S]*?)<\/Message>/g);
    if (!messages || messages.length === 0) {
      body.innerHTML = '<p class="text-muted">No messages</p>';
      return;
    }
    var html = '<div class="table-responsive"><table class="table table-sm table-hover"><thead><tr><th>#</th><th>From</th><th>Message</th><th>Date</th></tr></thead><tbody>';
    for (var i = 0; i < messages.length; i++) {
      var m = messages[i];
      var idx = xmlVal(m, 'Index');
      var phone = xmlVal(m, 'Phone');
      var content = xmlVal(m, 'Content');
      var date = xmlVal(m, 'Date');
      var smsc = xmlVal(m, 'Sca');
      html += '<tr><td>' + idx + '</td><td>' + escHtml(phone) + '</td><td>' + escHtml(content) + '</td><td class="text-nowrap small">' + fmtDate(date) + '</td></tr>';
    }
    html += '</tbody></table></div>';
    body.innerHTML = html;
    updateTime();
  }).catch(function(e) { body.innerHTML = '<span class="text-danger">Request failed: ' + e.message + '</span>'; });
}

function escHtml(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Refresh all visible
function refreshAll() {
  var active = document.querySelector('#mainTabs .nav-link.active');
  if (!active) return;
  var tabId = active.getAttribute('data-bs-target');
  if (tabId === '#tab-device') loadDeviceInfo();
  else if (tabId === '#tab-signal') loadSignal();
  else if (tabId === '#tab-network') loadNetwork();
  else if (tabId === '#tab-sms') { loadSmsCount(); loadSendStatus(); }
  else if (tabId === '#tab-config') { loadSmsConfig(); loadSmsConfigXml(); }
  else if (tabId === '#tab-inbox') loadInbox();
  toast('Refreshed', 'info');
}

// Load current tab on switch
document.querySelectorAll('#mainTabs .nav-link').forEach(function(tab) {
  tab.addEventListener('shown.bs.tab', function(e) {
    var id = e.target.getAttribute('data-bs-target');
    if (id === '#tab-device') loadDeviceInfo();
    else if (id === '#tab-signal') loadSignal();
    else if (id === '#tab-network') loadNetwork();
    else if (id === '#tab-sms') { loadSmsCount(); loadSendStatus(); }
    else if (id === '#tab-config') { loadSmsConfig(); loadSmsConfigXml(); }
    else if (id === '#tab-inbox') loadInbox();
  });
});

// Auto-refresh every 30s
setInterval(refreshAll, 30000);

// Initial load
loadDeviceInfo();
</script>
</body>
</html>
